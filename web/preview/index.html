<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaf Reader — Design Preview</title><style>
:root{--green:#38543f;--paper:#fbfaf7;--line:#dedfd8;--text:#292f29;--size:20px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0;border-radius:7px;padding:10px}button:hover{background:#e6ebe1}button:focus-visible{outline:2px solid var(--green)}.banner{padding:9px 22px;background:var(--green);color:white;font-size:12px;display:flex;justify-content:space-between}main{height:calc(100vh - 33px);display:grid;grid-template-columns:235px 310px 1fr}aside{padding:18px 12px;background:#eeefe8;display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;font-size:25px;font-weight:650;gap:9px;margin:0 10px 25px}.brand img{width:28px}.sidebarbutton{display:block;width:100%;text-align:left}.selected{background:#dce5d6;color:var(--green)}.count{float:right;color:#6c786a}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;margin:25px 10px 10px;color:#687664}.bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.timeline{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.heading{padding:23px 20px 13px}h2{font-size:22px;margin:0 0 8px}.muted{color:#70796e;font-size:12px}input[type=search]{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;margin-top:18px}.items{overflow:auto;flex:1}.item{display:block;width:100%;text-align:left;border-radius:0;border-top:1px solid var(--line);padding:20px;line-height:1.5}.item strong{font-size:16px;display:block;margin:8px 0}.item small{color:#74806e}.filters{display:flex;justify-content:space-evenly;padding:10px 0;border-top:1px solid var(--line);background:#f2f3ed}.filters button{font-size:12px;padding:10px 7px}.reader{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{border-bottom:1px solid var(--line);padding:9px 18px;display:flex;justify-content:space-between;gap:6px}.toolbar div{display:flex;gap:4px}.article{overflow:auto;flex:1;padding:50px clamp(24px,5vw,85px)}article{max-width:720px;margin:auto}article h1{font:42px/1.18 Georgia,serif;letter-spacing:-.8px}article p{font:var(--size)/1.85 Georgia,serif}.eyebrow{color:var(--green);letter-spacing:1.3px;font-size:11px}.articlefooter{margin:40px 0}.mobile{display:none}dialog{border:1px solid var(--line);border-radius:14px;width:min(790px,95vw);padding:0;background:var(--paper);color:var(--text);box-shadow:0 25px 100px #0003}dialog::backdrop{background:#14241866}.dialoghead{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialogbody{display:grid;grid-template-columns:165px 1fr;min-height:390px}.tabs{padding:16px 10px;background:#eef0e8}.tabs button{display:block;width:100%;text-align:left}.panel{padding:25px;max-height:65vh;overflow:auto}.panel h3{margin:0 0 15px;font-size:20px}.panel p{line-height:1.65;color:#65705f}.row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.row strong{font-size:14px}.primary{background:var(--green);color:white}.primary:hover{background:#4f6c4f}.pill{font-size:10px;background:#eceee5;color:#66725e;border-radius:20px;padding:5px 8px}.help{margin:15px 0;padding:12px;background:#eef1e7;border-radius:8px;line-height:1.7;font-size:12px}label{display:block;margin:20px 0}input[type=range]{width:100%;accent-color:var(--green)}select{padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:6px}#context{position:fixed;display:none;background:var(--paper);box-shadow:0 8px 40px #0003;border:1px solid var(--line);padding:6px;border-radius:9px;z-index:5}#context button{display:block;text-align:left;width:100%}body.dark{--paper:#222821;--text:#e7eadd;--line:#485044}body.dark aside,body.dark .tabs,body.dark .filters{background:#2c3529}body.dark .help{background:#34402f}#note{position:fixed;bottom:20px;right:24px;background:var(--green);color:white;padding:15px;border-radius:9px;max-width:340px;display:none;z-index:10}@media(max-width:800px){main{grid-template-columns:190px 1fr}.reader{display:none}body[data-view=reader] main{display:block}body[data-view=reader] aside,body[data-view=reader] .timeline{display:none}body[data-view=reader] .reader{display:flex;height:100%}.mobile{display:inline}article h1{font-size:34px}}@media(max-width:480px){main{grid-template-columns:1fr}aside{display:none}body[data-view=feeds] aside{display:flex;height:100%}body[data-view=feeds] .timeline{display:none}.dialogbody{display:block}.tabs{display:flex;overflow:auto}.tabs button{white-space:nowrap;width:auto}.toolbar{padding:7px}.toolbar button{padding:8px}.article{padding:25px}.banner{font-size:10px}.heading{padding:20px}.panel{padding:20px}}
</style><body data-view="list"><div class="banner"><strong>LEAF READER · DESIGN PREVIEW</strong><span>Sample articles · account connections are not active</span></div><main><aside><div class="brand"><img src="../favicon.svg" alt="">Leaf</div><button class="sidebarbutton selected" onclick="choose('unread')">● Unread <span id="unreadCount" class="count">3</span></button><button class="sidebarbutton" onclick="choose('saved')">☆ Read Later</button><button class="sidebarbutton" onclick="choose('all')">☷ All Items</button><div class="label">On this device</div><details open><summary>News &amp; opinion</summary><button class="sidebarbutton" onclick="feed('BusinessLine')">BusinessLine</button><button class="sidebarbutton" onclick="feed('Hindu Tamil')">Hindu Tamil</button></details><details open><summary>Technology</summary><button class="sidebarbutton" onclick="feed('MacRumors')">MacRumors</button></details><button class="sidebarbutton" onclick="settings('subscriptions')">＋ Add feed or folder</button><div class="bottom"><button class="sidebarbutton" onclick="settings('accounts')">Accounts &amp; Import…</button><button class="sidebarbutton" onclick="settings('reading')">⚙ Settings…</button><button class="mobile sidebarbutton" onclick="document.body.dataset.view='list'">Articles ›</button></div></aside><section class="timeline"><div class="heading"><button class="mobile" onclick="document.body.dataset.view='feeds'">☰ Feeds</button><h2 id="listTitle">Unread</h2><div class="muted">Your reading, in one place</div><input type="search" placeholder="Search articles…" aria-label="Search articles" oninput="draw(this.value)"></div><div class="items" id="items"></div><button onclick="markAll()">Mark all read</button><nav class="filters" aria-label="Item filters"><button onclick="choose('saved')">☆ Read Later</button><button onclick="choose('unread')">● Unread</button><button onclick="choose('all')">☷ All Items</button></nav></section><section class="reader"><header class="toolbar"><div><button class="mobile" onclick="back()">‹ Articles</button><button onclick="settings('reading')">Aa</button><button onclick="toggleRead()">Read / Unread</button></div><div><button onclick="save()">☆ Read Later</button><button onclick="notice('Sharing preview: Email, Copy Article Text, Copy Link, and system Share.')">Share…</button><button onclick="settings('reading')">⚙</button></div></header><div class="article"><article id="article"></article></div></section></main><dialog id="settings"><div class="dialoghead"><h2>Leaf Reader Settings</h2><button onclick="document.querySelector('dialog').close()">Done</button></div><div class="dialogbody"><nav class="tabs" id="tabs"></nav><div class="panel" id="panel"></div></div></dialog><div id="context"><button onclick="toggleRead()">Mark Read / Unread</button><button onclick="save()">Read Later</button><button onclick="notice('Preview: mark selected item and older articles read')">Mark Older Read…</button><button onclick="notice('Preview: Copy Article Text')">Copy Article Text</button><button onclick="notice('Preview: Open Original')">Open Original</button></div><div id="note" role="status"></div><script>
const $=s=>document.querySelector(s);let items=[{id:1,source:'BusinessLine',title:'A quieter way to follow the news',text:'This sample article demonstrates the proposed reader. Headlines stay in a clear list, subscriptions sit in folders, and the article has room to breathe.'},{id:2,source:'Hindu Tamil',title:'தமிழில் வாசிப்பதற்கு ஒரு அமைதியான இடம்',text:'தமிழ் கட்டுரைகளை வசதியாகப் படிக்க எழுத்து அளவையும் வரி இடைவெளியையும் தனித்தனியாக மாற்றலாம். இது வடிவமைப்பைச் சரிபார்ப்பதற்கான மாதிரிக் கட்டுரை.'},{id:3,source:'MacRumors',title:'Keep your reading in step across devices',text:'The account view separates local feeds from connected services. A supported connected account will synchronize subscriptions, folders, and reading state. File import copies subscriptions once.'}];let read=new Set(),saved=new Set(),selected=null,filter='unread',source='',messageTimer;
function draw(q=''){const list=items.filter(a=>(!source||a.source===source)&&(filter==='all'||filter==='saved'&&saved.has(a.id)||filter==='unread'&&(!read.has(a.id)||selected===a.id))&&a.title.toLowerCase().includes(q.toLowerCase()));$('#items').innerHTML=list.map(a=>`<button class="item ${selected===a.id?'selected':''}" onclick="openItem(${a.id})" oncontextmenu="menu(event,${a.id})"><small>${a.source.toUpperCase()} ${read.has(a.id)?'✓':'●'}</small><strong>${a.title}</strong><span class="muted">${a.text.slice(0,95)}…</span></button>`).join('')||'<p style="padding:25px">All caught up in this view.</p>';$('#unreadCount').textContent=items.filter(a=>!read.has(a.id)).length}
function openItem(id){selected=id;read.add(id);const a=items.find(a=>a.id===id);$('#article').innerHTML=`<div class="eyebrow">${a.source.toUpperCase()} · SAMPLE ARTICLE</div><h1>${a.title}</h1><div class="muted">25 October 2026</div><p>${a.text}</p><p>Use Aa to adjust the article separately from the interface. Reading controls stay in familiar places on Mac and iPhone.</p><p>When you leave this article, it disappears from Unread. Read Later keeps items easy to find, and All Items offers a deliberate way to revisit read articles.</p><nav class="filters articlefooter"><button onclick="choose('saved')">☆ Read Later</button><button onclick="choose('unread')">● Unread</button><button onclick="choose('all')">☷ All Items</button></nav>`;document.body.dataset.view='reader';draw()}
function back(){selected=null;document.body.dataset.view='list';draw()}function choose(f){filter=f;source='';selected=null;$('#listTitle').textContent={saved:'Read Later',unread:'Unread',all:'All Items'}[f];$('#article').innerHTML='<h1>Choose an article</h1>';document.body.dataset.view='list';draw()}function feed(s){source=s;filter='unread';selected=null;$('#listTitle').textContent=s;document.body.dataset.view='list';draw()}function toggleRead(){if(selected===null)return;read.has(selected)?read.delete(selected):read.add(selected);draw()}function save(){if(selected===null)return;saved.has(selected)?saved.delete(selected):saved.add(selected);draw();notice(saved.has(selected)?'Added to Read Later in this preview':'Removed from Read Later in this preview')}function markAll(){items.filter(a=>!source||a.source===source).forEach(a=>read.add(a.id));selected=null;$('#article').innerHTML='<h1>All caught up.</h1>';draw()}function notice(t){$('#note').textContent=t;$('#note').style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('#note').style.display='none',4500)}function menu(e,id){e.preventDefault();selected=id;$('#context').style.cssText=`display:block;left:${Math.min(e.clientX,innerWidth-220)}px;top:${Math.min(e.clientY,innerHeight-240)}px`}document.addEventListener('click',()=>$('#context').style.display='none');
const tabs={accounts:'Accounts & Import',subscriptions:'Subscriptions',reading:'Reading',appearance:'Appearance',behavior:'Reading Behavior',sharing:'Sharing',shortcuts:'Shortcuts',storage:'Storage & Sync'};
const providers=['Inoreader','Feedly','NewsBlur','The Old Reader','Feedbin','BazQux','FreshRSS','FeedHQ','Instapaper'];
function settings(tab){$('#tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?'selected':''}" onclick="settings('${k}')">${v}</button>`).join('');const panels={
accounts:`<h3>Accounts &amp; Import</h3><p>Read locally, connect a service, or bring your subscriptions from another reader.</p><div class="row"><div><strong>On this device</strong><div class="muted">Public feeds · no account needed</div></div><span class="pill">Local</span></div><div class="row"><div><strong>Import subscriptions</strong><div class="muted">OPML from Reeder, NetNewsWire, or any service</div></div><button class="primary" onclick="settings('import')">Import…</button></div><h4>Connect a service</h4><p class="help">Service connections below are proposed integrations. This preview does not sign in or synchronize.</p>${providers.map(p=>`<div class="row"><strong>${p}</strong><button onclick="notice('${p}: connection requires an implemented and configured integration. No account is connected by this preview.')">View setup</button></div>`).join('')}`,
import:`<h3>Import subscriptions</h3><p>Export subscriptions as OPML from your current reader, then choose that file in Leaf Reader.</p><label>From <select><option>Inoreader</option><option>Reeder</option><option>NetNewsWire</option><option>Feedly</option><option>NewsBlur</option><option>Other OPML file</option></select></label><label><input type="checkbox" checked> Preserve folders</label><label><input type="checkbox" checked> Skip duplicate subscriptions</label><div class="help">Proposed flow: choose file → preview feeds and folders → review skipped entries → import. Read/unread state is not included in a standard subscription OPML file.</div><button class="primary" onclick="notice('Design preview only. The released Leaf Reader already accepts OPML files; folder-preserving import is planned.')">Choose OPML file…</button>`,
subscriptions:`<h3>Subscriptions</h3><p>Folders organize feeds within each local or connected account.</p><div class="row"><strong>News &amp; opinion</strong><span>2 feeds</span></div><div class="row"><strong>Technology</strong><span>1 feed</span></div><div class="row"><button onclick="notice('Preview: create a folder and choose its account')">＋ New Folder</button><button onclick="notice('Preview: add a public feed or website URL')">＋ Add Feed</button></div><label>Order <select><option>Manual</option><option>Alphabetical</option></select></label><div class="help">Feed context menu: Rename, Move to Folder, Refresh, Mark Feed Read, Copy Feed URL, Remove.</div>`,
reading:`<h3>Reading</h3><label>Article text size <output id="sizeOut">20</output> px<input type="range" min="14" max="36" value="20" oninput="document.documentElement.style.setProperty('--size',this.value+'px');$('#sizeOut').textContent=this.value"></label><label>Article font <select><option>Serif</option><option>System sans serif</option></select></label><label>Line spacing <input type="range" min="1.3" max="2.2" step=".05" value="1.85"></label><label>Title size <input type="range" min="1.3" max="2.5" step=".1" value="2.1"></label><div class="help">Article size slider updates this preview. Other controls show the proposed organization. Bionic Reading is excluded.</div>`,
appearance:`<h3>Appearance</h3><label>Theme <select onchange="document.body.classList.toggle('dark',this.value==='Dark')"><option>Light</option><option>Dark</option></select></label><label>Interface text size <input type="range" min="11" max="20" value="13"></label><label><input type="checkbox" checked> Show feed icons</label><label><input type="checkbox" checked> Show article previews</label><label>Preview image <select><option>Off</option><option>Small</option><option>Large</option></select></label>`,
behavior:`<h3>Reading Behavior</h3><label>Mark read <select><option>When opening an article</option><option>Only when marked manually</option></select></label><label>Unread items <select><option>Hide after leaving the article</option><option>Hide immediately when marked read</option></select></label><label>Article order <select><option>Newest first</option><option>Oldest first</option></select></label><label><input type="checkbox" checked> Ask before marking all read</label><label><input type="checkbox" checked> Open next unread after marking all read</label><label><input type="checkbox" checked> Remember view and article position</label>`,
sharing:`<h3>Sharing</h3><p>Share article text or its link explicitly.</p><div class="row"><strong>Email Article Text</strong><span class="pill">Full available text</span></div><div class="row"><strong>Copy Article Text</strong><span class="pill">Text + source</span></div><div class="row"><strong>Copy Link / Open Original</strong><span class="pill">Link</span></div><div class="help">Use the system share sheet where supported. Restricted or unavailable text cannot be included.</div>`,
shortcuts:`<h3>Shortcuts</h3>${[['Space','Scroll / Next Unread'],['N','Next Unread'],['R / U','Toggle Read'],['S','Read Later'],['B','Open Original'],['← / →','Move between panes'],['⌘ ,','Settings']].map(([k,v])=>`<div class="row"><strong>${v}</strong><kbd>${k}</kbd></div>`).join('')}<p>Shortcuts must not activate while typing into search or a dialog.</p>`,
storage:`<h3>Storage &amp; Sync</h3><div class="row"><strong>On this device</strong><span class="pill">Local only</span></div><label>Keep read article text <select><option>Remove immediately</option><option>1 day</option><option>7 days</option><option>30 days</option></select></label><div class="help">Read markers persist independently of cached text. Connected accounts will display last successful sync, pending offline changes, and retryable errors.</div><button onclick="notice('Preview: show per-feed and per-account errors with Retry actions')">View sync &amp; feed errors…</button>`};$('#panel').innerHTML=panels[tab]||panels.accounts;if(!$('dialog').open)$('dialog').showModal()}
openItem(1);document.body.dataset.view='list';document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||$('dialog').open)return;if(e.key.toLowerCase()==='s')save();if(['r','u'].includes(e.key.toLowerCase()))toggleRead();if(e.key.toLowerCase()==='n'){let a=items.find(a=>!read.has(a.id));if(a)openItem(a.id)}});
</script></body></html>
